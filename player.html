<!DOCTYPE html>
<!-- mafia v0.6.1 | player.html | 29 Sep 2026 -->
<!--
  THE PLAYER SCREEN.

  v0.5 fixes four things found in the first live round:

  1. ERRORS ARE NO LONGER SWALLOWED. The Mafia panel ignored the error
     field completely, so a failed query looked identical to an empty
     result and the page confidently announced "you are the only Mafia
     left" to a player with three living partners. A query that fails now
     says so.

  2. NO MORE maybeSingle(). It throws when more than one row comes back.
     While the database was over-sharing, the player's own ballot query
     returned everybody's ballots, errored, and came back null - so the
     page never showed "ballot cast" and voting looked broken even though
     the vote had registered. Own rows are now picked client-side.

  3. DEATH IS ANNOUNCED. Life status changes now raise a banner that
     stays put until dismissed, instead of quietly restyling a heading
     that nobody was looking at.

  4. DEFENCE IN DEPTH. Everything private is filtered here as well as in
     the database. The database is the real boundary; this is the belt to
     its braces, so a future policy mistake degrades to a bug rather than
     a leak.
-->

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const URL = 'https://ashjitdpilxwcfhxamni.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzaGppdGRwaWx4d2NmaHhhbW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNDAxOTEsImV4cCI6MjEwNTYxNjE5MX0.wWTdrocCPlOWWN5CwTVi--OgWuVBEc99zWxWfVE_Gqk';

/*
  A storage key of our own. Without it this page and the admin console,
  being the same origin and the same project, share one session - so
  signing in here as a player silently took over the console, which then
  queried as that player and showed a roster of one.
*/
const sb = createClient(URL, KEY, {
  auth: { storageKey: 'ampid-player', persistSession: true }
});

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

/* --------------------------------------------------------------- text -- */

const ROLE_LABEL = {
  MAFIA: 'Mafia', DOCTOR: 'Doctor', SHERIFF: 'Sheriff', CIVILIAN: 'Civilian'
};

const ITEM_LABEL = {
  TEMP_IMMUNITY: 'Temporary Immunity',
  EXTRA_VOTE: 'Extra Vote',
  DISCOUNTED_RESURRECTION: 'Discounted Resurrection',
  ADDITIONAL_INVESTIGATION: 'Additional Investigation',
  REVEAL_ALIGNMENT_ON_DEATH: 'Reveal Alignment on Death',
  DOUBLE_SAVE: 'Double Save',
  SELF_SAVE: 'Self Save',
  BYPASS_DOCTOR_SAVE: 'Bypass Doctor Save',
  VOTE_MANIPULATION: 'Vote Manipulation',
  RECRUIT_NEW_MAFIA: 'Recruit New Mafia'
};

const ITEM_HINT = {
  TEMP_IMMUNITY: 'Blocks the kill and the public vote next round.',
  EXTRA_VOTE: 'Adds one weight to one ballot.',
  DISCOUNTED_RESURRECTION: 'Kept through death. Lowers one resurrection to 2 points.',
  ADDITIONAL_INVESTIGATION: 'A second investigation target for one round.',
  REVEAL_ALIGNMENT_ON_DEATH: 'Permanent. Publishes alignment on death.',
  DOUBLE_SAVE: 'Protect two different players for one round.',
  SELF_SAVE: 'You may target yourself for one round.',
  BYPASS_DOCTOR_SAVE: 'The kill ignores Doctor protection for one round.',
  VOTE_MANIPULATION: 'One anonymous vote adjustment.',
  RECRUIT_NEW_MAFIA: 'Convert a living non-Mafia. Blocked above three active Mafia.'
};

const STORE = {
  CIVILIAN: ['TEMP_IMMUNITY', 'EXTRA_VOTE', 'DISCOUNTED_RESURRECTION'],
  SHERIFF:  ['ADDITIONAL_INVESTIGATION', 'TEMP_IMMUNITY', 'REVEAL_ALIGNMENT_ON_DEATH'],
  DOCTOR:   ['DOUBLE_SAVE', 'SELF_SAVE'],
  MAFIA:    ['BYPASS_DOCTOR_SAVE', 'VOTE_MANIPULATION', 'RECRUIT_NEW_MAFIA']
};

const ACTION_FOR = {
  MAFIA:   'MAFIA_KILL_VOTE',
  DOCTOR:  'DOCTOR_SAVE',
  SHERIFF: 'SHERIFF_INVESTIGATE'
};

const PHASE_ORDER=['ATTENDANCE','HIDDEN_ACTIONS','MINIGAME','REWARDS','RESOLUTION','MASTER','DISCUSSION','VOTING','RESULTS'];
const PHASE_SHORT={ATTENDANCE:'Start',HIDDEN_ACTIONS:'Actions',MINIGAME:'Game',REWARDS:'Rewards',RESOLUTION:'Result',MASTER:'Master',DISCUSSION:'Talk',VOTING:'Vote',RESULTS:'End'};
const PHASE_STYLE={HIDDEN_ACTIONS:'hidden',MINIGAME:'minigame',REWARDS:'rewards',RESOLUTION:'results',MASTER:'hidden',DISCUSSION:'discussion',VOTING:'voting',RESULTS:'results',FINISHED:'finished',CLOSED:'closed',ATTENDANCE:'discussion'};
const IDLE = {
  CLOSED:      ['Nothing is running', 'The session is closed. Your role, tokens and items are all safe until Hunter opens the next week.'],
  ATTENDANCE:  ['Session starting', 'Hunter is marking who is here. Hold tight.'],
  MINIGAME:    ['Minigame', 'Play the game. Winners take a Reward Token.'],
  RESOLUTION:  ['Resolving', 'The night is being resolved. Watch the call.'],
  MASTER:      ['Master intervention', 'Nothing for you to do right now.'],
  DISCUSSION:  ['Discussion', 'Accuse, defend, bluff. The vote is next.'],
  RESULTS:     ['Results', 'The vote is in.'],
  FINISHED:    ['Game over', 'That is the end of this game.']
};

/* -------------------------------------------------------------- state -- */

let me = null;
let phase = null;
let roster = [];
let myAction = null;
let myBallot = null;
let myPurchases = [];
let mafiaPeers = null;      // null = not loaded, [] = genuinely none
let mafiaError = null;
let inbox = [];
let busy = false;
let timer = null;

/* Remembered across refreshes so a change can be announced rather than
   just quietly redrawn. Null until the first successful load. */
let lastLife = null;
/* The week number going DOWN means the admin started a new game. */
let lastRound = null;
let alertHtml = '';

const alive = () => me && me.life_status === 'ALIVE' && me.attendance_status === 'PRESENT';
const round = () => phase?.current_round ?? 0;
const nameOf = (id) => roster.find((r) => r.id === id)?.display_name ?? 'someone';

const owns = (type) => (me?.inventory || []).some(
  (i) => i.rewardType === type
    && (i.status === 'OWNED' || i.status === 'STAGED')
    && (i.eligibleFromRound == null || i.eligibleFromRound <= round())
);

/* --------------------------------------------------------------- load -- */

async function load() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;

  await sb.rpc('claim_my_seat');

  const { data: rows, error } = await sb
    .from('players')
    .select('id, display_name, role, alignment, life_status, attendance_status, reward_tokens, spirit_points, inventory, flags')
    .eq('auth_user_id', user.id);

  if (error) return fail('Could not load your role: ' + error.message);
  if (!rows || !rows.length) {
    return fail('You are signed in, but no seat is linked to this email yet. '
              + 'Ask Hunter to add it to your player.');
  }
  me = rows[0];
  lastLife = me.life_status;

  $('loginCard').classList.add('hide');
  $('roleCard').classList.remove('hide');
  $('rosterCard').classList.remove('hide');
  $('outWrap').classList.remove('hide');

  await refresh();
  if (!timer) timer = setInterval(refresh, 6000);
}

/*
  One read of everything that can change underneath the player.

  Note the absence of maybeSingle(). It raises an error the moment more
  than one row comes back, and "my own row" is a filter this page should
  apply itself rather than a guarantee it demands from the server.
*/
async function refresh() {
  if (busy) return;

  const [meRes, phaseRes, rosterRes] = await Promise.all([
    sb.from('players')
      .select('id, display_name, role, alignment, life_status, attendance_status, reward_tokens, spirit_points, inventory, flags')
      .eq('id', me.id),
    sb.from('game_phase').select('*'),
    sb.from('roster').select('id, display_name, life_status').order('display_name')
  ]);

  if (meRes.data && meRes.data.length) me = meRes.data[0];
  phase = (phaseRes.data && phaseRes.data[0])
    ?? { phase: 'CLOSED', current_round: 0, public_text: '', winner: '', eliminated_id: '' };
  roster = rosterRes.data ?? [];

  const r = round();
  /* New game: everyone is reset to alive. Without this, a player who was a
     Spirit last game would get a false "You are back" banner. */
  if (lastRound !== null && r < lastRound) {
    lastLife = me.life_status;
    alertHtml = '';
  }
  lastRound = r;
  const [aRes, bRes, pRes, iRes] = await Promise.all([
    sb.from('actions').select('*').eq('round', r),
    sb.from('ballots').select('*').eq('round', r),
    sb.from('purchases').select('*').eq('round', r).order('created_at'),
    sb.from('private_events').select('round, type, body, created_at')
      .order('created_at', { ascending: false }).limit(20)
  ]);

  /* Filtered here as well as in the database. If a policy is ever wrong
     again, this turns a leak into a bug. */
  myAction    = (aRes.data ?? []).find((x) => x.actor_id === me.id) ?? null;
  myBallot    = (bRes.data ?? []).find((x) => x.voter_id === me.id) ?? null;
  myPurchases = (pRes.data ?? []).filter((x) => x.player_id === me.id);
  inbox       = iRes.data ?? [];

  await loadMafiaPeers();
  checkLifeChange();
  paint();
}

/* Kept separate so its error is visible rather than inferred. */
async function loadMafiaPeers() {
  if (!me || me.role !== 'MAFIA' || me.life_status !== 'ALIVE') {
    mafiaPeers = null; mafiaError = null;
    return;
  }
  const { data, error } = await sb.from('mafia_peers')
    .select('id, display_name, life_status');
  if (error) {
    mafiaError = error.message;
    mafiaPeers = null;
    return;
  }
  mafiaError = null;
  mafiaPeers = (data ?? []).filter((p) => p.id !== me.id);
}

/*
  Being killed used to change a heading colour and nothing else, so people
  only found out by logging out and back in. It now raises a banner and
  stays there until acknowledged.
*/
function checkLifeChange() {
  if (!me || lastLife === null) return;
  if (me.life_status === lastLife) return;

  if (lastLife === 'ALIVE' && me.life_status !== 'ALIVE') {
    const votedOut = phase?.eliminated_id === me.id;
    alertHtml = `
      <div class="big">You are out.</div>
      <p class="hint">${votedOut
        ? 'The group voted you out. Your role has been revealed to everyone.'
        : 'You were killed. Your role has not been revealed.'}</p>
      <p class="hint">You are a Spirit now. Keep turning up &mdash; attendance earns
        Spirit Points, and enough of them buys your way back in as a Civilian.
        You cannot act, vote or buy rewards while you are out.</p>`;
  } else if (lastLife !== 'ALIVE' && me.life_status === 'ALIVE') {
    alertHtml = `
      <div class="big" style="color:#7fe0ae">You are back.</div>
      <p class="hint">Your resurrection went through. You return as a Civilian,
        whatever you were before.</p>`;
  }
  lastLife = me.life_status;
}

/* -------------------------------------------------------------- paint -- */

function paint() {
  $('week').textContent = round() ? `Week ${round()}` : 'Not started';
  $('who').textContent = me.display_name;

  const isMafia = me.role === 'MAFIA';
  const spirit = me.life_status !== 'ALIVE';
  $('role').textContent=spirit?'Spirit':(ROLE_LABEL[me.role]??me.role);
  $('role').className = 'role'
    + (spirit ? ' isSpirit' : isMafia ? ' isMafia' : '');
  $('tok').textContent = me.reward_tokens ?? 0;
  $('spi').textContent = me.spirit_points ?? 0;
  $('stats').classList.remove('hide');

  paintAlert();
  paintPhase();
  paintMafia();
  paintInbox();
  paintRoster();

  $('foot').textContent = 'Updates automatically. Last checked '
    + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function paintAlert() {
  const host = $('alertCard');
  if (!alertHtml) return void (host.innerHTML = '');
  host.innerHTML = card('alert', alertHtml
    + '<button class="small" id="ackAlert">Got it</button>');
  $('ackAlert').onclick = () => { alertHtml = ''; paintAlert(); };
}

function paintProgress(){const host=$('phaseProgress');if(!me||!phase||phase.phase==='CLOSED'||phase.phase==='FINISHED'){host.classList.add('hide');host.innerHTML='';return;}const current=PHASE_ORDER.indexOf(phase.phase);host.classList.remove('hide');host.innerHTML=PHASE_ORDER.map((p,i)=>`<div class="step ${i<current?'done':i===current?'active':''}"><span class="bar"></span><span class="txt">${PHASE_SHORT[p]}</span></div>`).join('');}
function paintPhase() {
  const host = $('phaseCard');
  const p = phase.phase;
  host.className='phase-'+(PHASE_STYLE[p]??'closed');paintProgress();

  if (p === 'FINISHED') {
    return void (host.innerHTML = card('quiet',
      `<h3>Game over</h3><p class="hint">${phase.winner === 'GOOD'
        ? 'The town wins.' : 'The Mafia win.'}</p>`));
  }

  if (p === 'HIDDEN_ACTIONS') return paintAction(host);
  if (p === 'REWARDS')        return paintShop(host);
  if (p === 'VOTING')         return paintVote(host);

  if (p === 'RESULTS') {
    const who = phase.eliminated_id ? nameOf(phase.eliminated_id) : null;
    return void (host.innerHTML = card('quiet', `
      <h3>Results</h3>
      <p class="hint">${who
        ? esc(who) + ' was voted out.'
        : 'The vote produced no elimination.'}</p>`));
  }

  const [title, text] = IDLE[p] ?? ['Standing by', 'Nothing to submit right now.'];
  host.innerHTML = card('quiet',
    `<h3>${esc(title)}</h3><p class="hint">${esc(text)}</p>`
    + (phase.public_text ? `<div class="note">${esc(phase.public_text)}</div>` : ''));
}

/* --------------------------------------------------- hidden actions --- */

function paintAction(host) {
  const type = ACTION_FOR[me.role];

  if (!type) {
    return void (host.innerHTML = card('quiet',
      `<h3>Hidden actions</h3>
       <p class="hint">Civilians have no night action. Sit tight &mdash; the minigame is next.</p>`));
  }
  if (!alive()) {
    return void (host.innerHTML = card('quiet',
      `<h3>Hidden actions</h3><p class="hint">You cannot act this week.</p>`));
  }

  const label = {
    MAFIA_KILL_VOTE:     ['Choose your kill target',
      'Every active Mafia picks one. Majority decides; a tie is broken at random.'],
    DOCTOR_SAVE:         ['Choose who to protect',
      'Blocks the Mafia kill unless a Bypass is in play.'],
    SHERIFF_INVESTIGATE: ['Choose who to investigate',
      'Innocent is always truthful. Suspicious proves nothing.']
  }[type];

  const allowSelf = me.role === 'DOCTOR' && owns('SELF_SAVE');
  const second =
    (me.role === 'DOCTOR'  && owns('DOUBLE_SAVE'))              ? 'Second player to protect' :
    (me.role === 'SHERIFF' && owns('ADDITIONAL_INVESTIGATION')) ? 'Second player to investigate' : null;

  const pool = roster.filter((r) => r.life_status === 'ALIVE'
    && (allowSelf || r.id !== me.id));

  const done = !!myAction;
  host.innerHTML = card('act', `
    <h3>${esc(label[0])}</h3>
    <p class="hint">${esc(label[1])}</p>
    ${done ? `<div class="ok">Submitted &mdash; you chose
      <strong>${esc(nameOf(myAction.target_id))}</strong>.
      You can change it until Hunter moves on.</div>` : ''}
    <label>Target</label>
    <select id="aT">${optionList(pool, myAction?.target_id)}</select>
    ${second ? `<label>${esc(second)}</label>
       <select id="aT2">${optionList(pool, myAction?.secondary_target_id)}</select>` : ''}
    <button id="aGo">${done ? 'Update my choice' : 'Submit'}</button>
    <div id="aMsg"></div>`);

  $('aGo').onclick = () => submitAction(type);
}

async function submitAction(type) {
  const target = $('aT').value;
  const second = $('aT2') ? $('aT2').value : null;
  if (!target) return say('aMsg', 'Pick someone first.', true);

  busy = true;
  const { error } = await sb.from('actions').upsert({
    round: round(),
    actor_id: me.id,
    type,
    target_id: target,
    secondary_target_id: second || null
  }, { onConflict: 'round,actor_id' });
  busy = false;

  if (error) return say('aMsg', explain(error.message), true);
  say('aMsg', 'Locked in.', false);
  refresh();
}

/* ------------------------------------------------------------- shop --- */

function paintShop(host) {
  const tokens = me.reward_tokens ?? 0;
  const pending = myPurchases.filter((p) => p.status === 'PENDING');
  const decided = myPurchases.filter((p) => p.status !== 'PENDING');
  const store = STORE[me.role] ?? [];

  if (!alive()) {
    return void (host.innerHTML = card('quiet',
      `<h3>Tokens</h3>
       <p class="hint">Spirits cannot buy rewards. Attend each week to build Spirit Points
        toward coming back.</p>`));
  }

  host.innerHTML = card('act', `
    <h3>Spend your tokens</h3>
    <p class="hint">Every reward costs one token. Requests are private &mdash;
      Hunter confirms them and only then is the token taken.</p>
    ${tokens ? '' : '<div class="note">You have no tokens to spend this week.</div>'}
    ${pending.length ? `<div class="ok">${pending.length} request${pending.length > 1 ? 's' : ''}
      waiting on Hunter.</div>` : ''}
    <div id="shopList">
      ${store.map((item) => {
        const queued = pending.some((p) => p.reward_type === item);
        const canBuy = tokens > pending.length && !queued;
        return `<div class="item">
          <div>
            <div class="t">${esc(ITEM_LABEL[item])}</div>
            <div class="d">${esc(ITEM_HINT[item])}</div>
          </div>
          ${queued
            ? '<span class="pill wait">Requested</span>'
            : `<button class="small" data-buy="${item}" ${canBuy ? '' : 'disabled'}>Buy</button>`}
        </div>`;
      }).join('')}
    </div>
    ${decided.length ? `<div style="margin-top:16px">${decided.map((p) =>
      `<div class="item"><div class="t">${esc(ITEM_LABEL[p.reward_type] ?? p.reward_type)}</div>
       <span class="pill ${p.status === 'ACCEPTED' ? 'on' : ''}">${esc(p.status)}</span></div>`
      ).join('')}</div>` : ''}
    <div id="sMsg"></div>`);

  host.querySelectorAll('[data-buy]').forEach((btn) => {
    btn.onclick = () => requestPurchase(btn.dataset.buy);
  });
}

async function requestPurchase(rewardType) {
  busy = true;
  const { error } = await sb.from('purchases').insert({
    round: round(),
    player_id: me.id,
    reward_type: rewardType,
    status: 'PENDING'
  });
  busy = false;

  if (error) return say('sMsg', explain(error.message), true);
  say('sMsg', 'Requested privately. Hunter will confirm it.', false);
  refresh();
}

/* ------------------------------------------------------------- vote --- */

function paintVote(host) {
  if (!alive()) {
    return void (host.innerHTML = card('quiet',
      `<h3>The vote</h3>
       <p class="hint">Spirits and Dormant players do not vote.</p>`));
  }

  const pool = roster.filter((r) => r.life_status === 'ALIVE');
  const done = !!myBallot;

  host.innerHTML = card('act', `
    <h3>Who do you vote for?</h3>
    <p class="hint">Completely anonymous. Nobody &mdash; not even the other players &mdash;
      can see who you picked. Only the totals are read out.</p>
    ${done ? `<div class="ok">Ballot cast for
      <strong>${esc(nameOf(myBallot.target_id))}</strong>.
      You can change it until voting closes.</div>` : ''}
    <label>Your vote</label>
    <select id="vT">${optionList(pool, myBallot?.target_id)}</select>
    <button id="vGo">${done ? 'Change my vote' : 'Cast my vote'}</button>
    <div id="vMsg"></div>`);

  $('vGo').onclick = castVote;
}

async function castVote() {
  const target = $('vT').value;
  if (!target) return say('vMsg', 'Pick someone first.', true);

  busy = true;
  const { error } = await sb.from('ballots').upsert({
    round: round(),
    voter_id: me.id,
    target_id: target
  }, { onConflict: 'round,voter_id' });
  busy = false;

  if (error) return say('vMsg', explain(error.message), true);
  say('vMsg', 'Vote recorded.', false);
  refresh();
}

/* ------------------------------------------------------ side panels --- */

function paintMafia() {
  const host = $('mafiaCard');

  if (me.role !== 'MAFIA' || me.life_status !== 'ALIVE') {
    return void (host.innerHTML = '');
  }

  /* An error is not the same as an empty list, and telling a Mafia member
     they are alone when they are not is a game-deciding lie. */
  if (mafiaError) {
    return void (host.innerHTML = card('mafia', `
      <h2>Your Mafia</h2>
      <div class="err">Could not load your partners: ${esc(mafiaError)}<br>
        Do not assume you are alone &mdash; ask Hunter.</div>`));
  }

  if (mafiaPeers === null) {
    return void (host.innerHTML = card('mafia',
      '<h2>Your Mafia</h2><p class="hint">Loading&hellip;</p>'));
  }

  host.innerHTML = card('mafia', `
    <h2>Your Mafia</h2>
    ${mafiaPeers.length
      ? mafiaPeers.map((p) => `<div class="who${p.life_status === 'ALIVE' ? '' : ' out'}">
          <span class="dot"></span><span class="n">${esc(p.display_name)}</span>
          ${p.life_status === 'ALIVE' ? '' : '<span class="status">Out</span>'}
        </div>`).join('')
      : '<p class="hint">You are the only Mafia left.</p>'}`);
}

function paintInbox() {
  const host = $('inboxCard');
  if (!inbox.length) return void (host.innerHTML = '');
  host.innerHTML = card('quiet', `
    <h2>For your eyes only</h2>
    ${inbox.slice(0, 8).map((e) => `<div class="item">
      <div><div class="t">${esc(e.body)}</div>
      <div class="d">Week ${e.round}</div></div>
    </div>`).join('')}`);
}

function paintRoster() {
  $('roster').innerHTML = roster.map((p) => {
    const out = p.life_status !== 'ALIVE';
    return `<div class="who${out ? ' out' : ''}">
      <span class="dot"></span>
      <span class="n">${esc(p.display_name)}</span>
      ${p.id === me.id ? '<span class="you">You</span>' : ''}
      ${out ? '<span class="status">Out</span>' : ''}
    </div>`;
  }).join('');
}

/* ------------------------------------------------------------ utils --- */

const card = (cls, inner) => `<div class="card ${cls}">${inner}</div>`;

function optionList(pool, selected) {
  return '<option value="">— choose —</option>' + pool.map((p) =>
    `<option value="${esc(p.id)}"${selected === p.id ? ' selected' : ''}>${esc(p.display_name)}</option>`
  ).join('');
}

function say(id, msg, bad) {
  const n = $(id);
  if (n) n.innerHTML = `<div class="${bad ? 'err' : 'ok'}" style="margin:14px 0 0">${esc(msg)}</div>`;
}

function fail(msg) {
  $('err').innerHTML = `<div class="err">${esc(msg)}</div>`;
}

function explain(message) {
  if (/row-level security|violates row-level/i.test(message)) {
    return 'That was not accepted — the phase has probably moved on, or you are '
         + 'not eligible this week. Refresh and check the screen above.';
  }
  if (/duplicate key/i.test(message)) {
    return 'You already have a request in for that. Wait for Hunter to confirm it.';
  }
  return message;
}

/* ------------------------------------------------------------- boot --- */

$('go').onclick = async () => {
  $('err').innerHTML = '';
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim().toLowerCase(),
    password: $('pw').value
  });
  if (error) return fail(error.message);
  load();
};

$('pw').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };

$('out').onclick = async () => {
  clearInterval(timer);
  await sb.auth.signOut();
  location.reload();
};

const { data: { session } } = await sb.auth.getSession();
if (session) load();
</script>
</body>
</html>
