<!DOCTYPE html>
<!-- mafia v0.3.1 | player.html | 22 Sep 2026 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Among PID</title>
<style>
  body { margin:0; padding:24px; background:#0b1120; color:#e8edf7;
         font:16px/1.5 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width:420px; margin:40px auto; }
  h1 { font-size:20px; letter-spacing:.08em; text-transform:uppercase;
       margin:0 0 24px; text-align:center; }
  .card { background:#16223c; border:1px solid #1e2c49;
          border-radius:12px; padding:24px; margin-bottom:16px; }
  label { display:block; font-size:11px; letter-spacing:.1em;
          text-transform:uppercase; color:#64789c; margin:0 0 6px; }
  input { background:#0b1120; border:1px solid #27395c; border-radius:8px;
          padding:12px; width:100%; color:#e8edf7; font:inherit;
          margin-bottom:16px; box-sizing:border-box; }
  button { padding:13px; width:100%; border-radius:8px; border:none;
           background:#d4a933; color:#241c05; font:inherit;
           font-weight:700; cursor:pointer; }
  button.ghost { background:#1d2c4c; color:#e8edf7; font-weight:400;
                 margin-top:20px; }
  .err { background:#3a1418; border-left:3px solid #d9534f; color:#ffc9c6;
         padding:12px; border-radius:6px; margin-bottom:16px; font-size:14px; }
  .name { color:#93a5c4; font-size:14px; }
  .role { font-size:34px; font-weight:700; color:#d4a933;
          margin:8px 0 0; letter-spacing:.02em; }
  .hide { display:none; }

  h2 { font-size:11px; letter-spacing:.1em; text-transform:uppercase;
       color:#64789c; margin:0 0 14px; font-weight:600; }
  .who { display:flex; align-items:center; gap:10px;
         padding:10px 0; border-bottom:1px solid #1e2c49; }
  .who:last-child { border-bottom:none; }
  .dot { width:8px; height:8px; border-radius:50%; flex:0 0 8px;
         background:#3fbf6f; }
  .out .dot { background:#5a6b87; }
  .out .n { color:#5a6b87; text-decoration:line-through; }
  .n { flex:1; }
  .you { font-size:11px; letter-spacing:.08em; text-transform:uppercase;
         color:#d4a933; }
  .status { font-size:12px; color:#64789c; }
  .stats { display:flex; gap:20px; margin-top:16px;
           padding-top:16px; border-top:1px solid #1e2c49; }
  .stat .v { font-size:22px; font-weight:700; }
  .stat .k { font-size:11px; letter-spacing:.08em;
             text-transform:uppercase; color:#64789c; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Among PID</h1>

  <div class="card" id="loginCard">
    <div id="err"></div>
    <label>Email</label>
    <input id="email" type="email" autocomplete="username">
    <label>Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="go">Log in</button>
  </div>

  <div class="card hide" id="roleCard">
    <div class="name" id="who"></div>
    <div class="role" id="role"></div>
    <div class="stats hide" id="stats">
      <div class="stat"><div class="v" id="tok">0</div><div class="k">Tokens</div></div>
      <div class="stat"><div class="v" id="spi">0</div><div class="k">Spirit points</div></div>
    </div>
  </div>

  <div class="card hide" id="rosterCard">
    <h2>Who is playing</h2>
    <div id="roster"></div>
  </div>

  <div class="hide" id="outWrap">
    <button class="ghost" id="out">Log out</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const URL = 'https://ashjitdpilxwcfhxamni.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzaGppdGRwaWx4d2NmaHhhbW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNDAxOTEsImV4cCI6MjEwNTYxNjE5MX0.wWTdrocCPlOWWN5CwTVi--OgWuVBEc99zWxWfVE_Gqk';

const sb = createClient(URL, KEY);
const $ = (id) => document.getElementById(id);

const esc = (s) => String(s).replace(/[&<>"]/g,
  (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

async function load() {
  const { data: { user } } = await sb.auth.getUser();

  // Claim a seat if one is waiting for this email address. Safe to call every
  // time: it does nothing once a seat is already linked, and it can only ever
  // link the seat the admin set aside for this exact address.
  await sb.rpc('claim_my_seat');

  // My own row. The database only ever returns this player's row, so the role
  // on it is safe to display.
  const { data: me, error: meErr } = await sb
    .from('players')
    .select('id, display_name, role, reward_tokens, spirit_points')
    .eq('auth_user_id', user.id);

  if (meErr) return fail('Could not load your role: ' + meErr.message);
  if (!me.length) {
    return fail('You are signed in, but no seat is linked to this email yet. ' +
                'Ask Hunter to add it to your player.');
  }

  $('who').textContent  = me[0].display_name;
  $('role').textContent = 'You are the ' + me[0].role;
  $('tok').textContent  = me[0].reward_tokens ?? 0;
  $('spi').textContent  = me[0].spirit_points ?? 0;
  $('stats').classList.remove('hide');

  // The roster. A separate, deliberately safe list: names and alive status
  // only. It has no role column to leak.
  const { data: roster, error: rErr } = await sb
    .from('roster')
    .select('id, display_name, life_status')
    .order('display_name');

  if (rErr) {
    $('roster').innerHTML = '<div class="status">Could not load the roster: '
      + esc(rErr.message) + '</div>';
  } else {
    $('roster').innerHTML = roster.map((p) => {
      const out = p.life_status !== 'ALIVE';
      return '<div class="who' + (out ? ' out' : '') + '">'
        + '<span class="dot"></span>'
        + '<span class="n">' + esc(p.display_name) + '</span>'
        + (p.id === me[0].id ? '<span class="you">You</span>' : '')
        + (out ? '<span class="status">Out</span>' : '')
        + '</div>';
    }).join('');
  }

  $('loginCard').classList.add('hide');
  $('roleCard').classList.remove('hide');
  $('rosterCard').classList.remove('hide');
  $('outWrap').classList.remove('hide');
}

function fail(msg) {
  $('err').innerHTML = '<div class="err">' + esc(msg) + '</div>';
}

$('go').onclick = async () => {
  $('err').innerHTML = '';
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('pw').value
  });
  if (error) return fail(error.message);
  load();
};

$('out').onclick = async () => {
  await sb.auth.signOut();
  location.reload();
};

const { data: { session } } = await sb.auth.getSession();
if (session) load();
</script>
</body>
</html>
