<!DOCTYPE html>
<!-- mafia v1.5 | observer.html | 21 Oct 2026 | visual layer v1.0 (cartoon skin) -->
<!--
  THE OBSERVER SCREEN.
  Read-only. Same look as player.html and spectator.html, laid out wide for
  a laptop or TV. Shows EVERYTHING as it happens:
    - who every Mafia has picked to kill, live, and whether immunity saves them
    - the minigame, the wheel, the winners and who got paid
    - Master awards as they are chosen and confirmed
    - every shop request and purchase, including Sabotage targets
    - the live vote board with real weights (Extra Vote and Master x2),
      immunity, sabotage and who bought it, and a projected result
    - every player's role, tokens, Spirit Points and items
    - a timeline of everything that has happened

  WHY A SEPARATE PAGE
  spectator.html is spoiler-free on purpose - anyone can watch it, players
  included. This page is the opposite, so it lives on its own page with its
  own login rule. Nothing here changes what players or spectators can see.

  HOW IT READS DATA
  One call: observer_snapshot() (observer.sql). The database refuses it
  unless the account is in the observers table (or is an admin), and always
  refuses a login that is linked to a player seat.

  Press H (or "Hide secrets") to cover the screen instantly.

  v1.3.1: the crewmate groups used the class "crew", which is also the
  avatar class (36px wide). The Crew and Spirits groups were squashed to
  36px and their cards spilled over each other. Groups now use g-* classes.
  Sign-in errors now say exactly what is wrong.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Among PID — Observer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0e22;
    --panel: #1c2650;
    --panel-2: #131a3d;
    --text: #eef2ff;
    --muted: #b7c3e6;
    --faint: #8e9bc4;
    --red: #ff4d4d;
    --cyan: #38d9f5;
    --yellow: #ffd23f;
    --green: #4ade80;
    --purple: #a98bff;
    --line: 3px solid var(--ink);
    --drop: 0 6px 0 var(--ink);
    --drop-sm: 0 4px 0 var(--ink);
    --o2: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink),
          0 -2px 0 var(--ink), 0 2px 0 var(--ink), -2px 0 0 var(--ink), 2px 0 0 var(--ink), 0 4px 0 var(--ink);
    --o3: -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink), 3px 3px 0 var(--ink),
          0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink), 0 6px 0 var(--ink);
    --head: "Fredoka", "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: #070a1c; }
  body { margin: 0; min-height: 100vh; color: var(--text); overflow-x: hidden;
         font: 400 16px/1.5 "Nunito", system-ui, sans-serif; }

  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      linear-gradient(rgba(5, 7, 22, .55), rgba(5, 7, 22, .55)),
      url("bg.jpg") center / cover no-repeat,
      radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 72% 12%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 38% 64%, #cfd8ff 50%, transparent 51%),
      radial-gradient(2px 2px at 86% 58%, #fff 50%, transparent 51%),
      radial-gradient(circle at 20% 10%, #2a1f5c 0, transparent 45%),
      radial-gradient(circle at 85% 80%, #102a5c 0, transparent 50%),
      #0a0d26;
  }
  body::after {
    content: ""; position: fixed; inset: -200px 0 0 0; z-index: -1; pointer-events: none;
    opacity: .7;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 140px 90px, #dfe6ff 50%, transparent 51%),
      radial-gradient(1px 1px at 90px 160px, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 170px 180px, #fff5cc 50%, transparent 51%);
    background-size: 200px 200px;
  }
  @media (prefers-reduced-motion: no-preference) {
    body::after { animation: drift 90s linear infinite; }
    @keyframes drift { to { transform: translateY(200px); } }
  }

  /* -------------------------------------------------------------- layout */
  .wrap { max-width: 1360px; margin: 0 auto; padding: 24px 20px 48px; }
  .wrap.narrow { max-width: 560px; }
  .hide { display: none !important; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
  .col-main, .col-side { min-width: 0; }
  .col-side { position: sticky; top: 16px; }
  @media (max-width: 1040px) {
    .layout { grid-template-columns: 1fr; }
    .col-side { position: static; }
  }

  /* -------------------------------------------------------------- header */
  .masthead { text-align: center; margin: 4px 0 20px; }
  h1 { margin: 0; font: 700 44px/1 var(--head); letter-spacing: .04em;
       text-transform: uppercase; color: #fff; text-shadow: var(--o3); }
  h1 .accent { color: var(--red); }
  .mrow { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 16px;
          font: 600 15px/1.4 var(--head); color: var(--ink); background: var(--yellow);
          border: var(--line); border-radius: 999px; box-shadow: var(--drop-sm); }
  .chip:empty { display: none; }
  .chip.phase { background: var(--cyan); }
  .chip.live { color: #fff; background: var(--purple); letter-spacing: .06em; text-transform: uppercase; }
  .chip.live .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); }
  @media (prefers-reduced-motion: no-preference) {
    .chip.live .dot { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
  }
  button.chipbtn { display: inline-flex; width: auto; min-height: 0; padding: 4px 16px;
                   font: 600 15px/1.4 var(--head); color: #fff; background: #2d3970;
                   border: var(--line); border-radius: 999px; box-shadow: var(--drop-sm); }
  button.chipbtn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

  /* --------------------------------------------------------------- cards */
  .card { position: relative; min-width: 0; background: var(--panel); border: var(--line);
          border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: var(--drop); }
  .card.now { border-color: var(--yellow);
              box-shadow: 0 0 0 3px rgba(255, 210, 63, .3), 0 0 26px rgba(255, 210, 63, .18), var(--drop); }
  h2 { margin: 0 0 12px; font: 700 21px/1.2 var(--head); color: #fff;
       text-shadow: var(--o2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  h2 .sp { flex: 1; }
  h3 { margin: 0 0 8px; font: 700 28px/1.15 var(--head); color: var(--accent, #fff); text-shadow: var(--o2); }
  p.hint { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
  .sub { margin: 16px 0 8px; font: 600 13px/1.3 var(--head); letter-spacing: .1em;
         text-transform: uppercase; color: var(--faint); }

  .livetag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px;
             font: 600 12px/1.4 var(--head); letter-spacing: .08em; text-transform: uppercase;
             color: var(--ink); background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px;
             text-shadow: none; }
  .livetag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--red);
                     border: 2px solid var(--ink); }
  .secret { display: inline-block; padding: 2px 10px; font: 600 12px/1.4 var(--head);
            letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--red);
            border: 2px solid var(--ink); border-radius: 999px; text-shadow: none; }

  /* ----------------------------------------------------- login / veil */
  .login { text-align: center; padding: 24px 20px; }
  .login-crew { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: 0 0 8px; }
  .login-crew .crew { width: 56px; height: 56px; }
  .login-crew .crew:nth-child(2) { width: 72px; height: 72px; }
  .login-title { justify-content: center; font-size: 30px; margin-bottom: 4px; }
  .login .fields { text-align: left; }
  .veil-card { text-align: center; padding: 48px 20px; max-width: 560px; margin: 40px auto; }
  .veil-card .crew { width: 96px; height: 96px; margin: 0 auto 12px; }
  .veil-card button { max-width: 280px; margin: 8px auto 0; }

  /* -------------------------------------------------------------- forms */
  label { display: block; margin: 0 0 6px; font: 600 15px/1.3 var(--head); color: var(--muted); }
  input { width: 100%; min-height: 52px; margin: 0 0 16px; padding: 12px 14px;
          font: 400 16px/1.3 "Nunito", sans-serif; color: var(--text);
          background: var(--panel-2); border: var(--line); border-radius: 16px; }
  input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(56, 217, 245, .35); }

  /* ------------------------------------------------------------ buttons */
  button { display: block; width: 100%; min-height: 52px; padding: 12px 20px; cursor: pointer;
           font: 700 18px/1.2 var(--head); letter-spacing: .02em; color: #062530;
           background: var(--cyan); border: var(--line); border-radius: 16px;
           box-shadow: 0 5px 0 var(--ink); transition: transform .08s, box-shadow .08s, filter .12s; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  button:disabled { cursor: not-allowed; color: #8c95b5; background: #343d63; box-shadow: 0 3px 0 var(--ink); }
  button.ghost { margin-top: 8px; color: #fff; background: #2d3970; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .seg { display: inline-flex; gap: 6px; }
  .seg button { width: auto; min-height: 0; padding: 3px 12px; font: 600 13px/1.4 var(--head);
                color: #fff; background: #2d3970; border: 2px solid var(--ink); border-radius: 999px;
                box-shadow: 0 3px 0 var(--ink); text-shadow: none; }
  .seg button.on { color: var(--ink); background: var(--yellow); }

  /* ---------------------------------------------------- message boxes */
  .err, .ok, .note { margin: 0 0 16px; padding: 12px 16px; border-radius: 16px;
                     border: 3px solid; font-size: 15px; font-weight: 700; }
  .err  { background: #3d0f1a; border-color: var(--red); color: #ffd2d2; }
  .ok   { background: #0f3a28; border-color: var(--green); color: #cff8de; }
  .note { background: #141b42; border-color: var(--yellow); color: #ffe894; }
  .note b, .err b, .ok b { color: #fff; }

  .announce { margin: 4px 0 0; padding: 18px 16px; text-align: center; border: var(--line);
              border-radius: 16px; background: #070a1c; box-shadow: var(--drop-sm);
              font: 700 22px/1.25 var(--head); color: #fff; text-shadow: var(--o2); }
  .announce .ak { display: inline-block; margin-bottom: 10px; padding: 3px 14px; border: var(--line);
                  border-radius: 999px; background: var(--yellow); color: var(--ink);
                  font: 600 13px/1.4 var(--head); letter-spacing: .08em; text-transform: uppercase; text-shadow: none; }
  .announce .at { display: block; }
  .truth { margin-top: 10px; font: 600 15px/1.4 "Nunito", sans-serif; color: #ffb3c7; text-shadow: none; }

  /* ---------------------------------------------------------- avatars */
  .crew { display: block; width: 36px; height: 36px; flex: 0 0 auto; overflow: visible; }
  .crew.mini { display: inline-block; width: 18px; height: 18px; vertical-align: -4px; margin-right: 4px; }
  .crew.big { width: 96px; height: 96px; margin: 0 auto; }
  .crew.ghost { opacity: .45; filter: grayscale(.7); }

  /* ------------------------------------------------------ phase steps */
  .phase-progress { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; margin: 0 0 20px; }
  .phase-progress .step { min-width: 0; padding: 8px 2px; text-align: center; border: var(--line);
                          border-radius: 12px; background: var(--panel-2); box-shadow: 0 3px 0 var(--ink); }
  .phase-progress .txt { display: block; font: 600 14px/1.2 var(--head); color: var(--faint);
                         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .phase-progress .done { background: #1d4a38; }
  .phase-progress .done .txt { color: #b9f5cf; }
  .phase-progress .active { background: var(--yellow); transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink); }
  .phase-progress .active .txt { color: var(--ink); font-weight: 700; }
  @media (max-width: 599px) { .phase-progress { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  /* ------------------------------------------------------------- hero */
  .hero { display: flex; gap: 20px; align-items: center; }
  .hero .hbody { flex: 1; min-width: 0; }
  .hero .hk { margin-bottom: 4px; font: 600 14px/1.3 var(--head); letter-spacing: .1em;
              text-transform: uppercase; color: var(--faint); }
  .hero h3 { font-size: 34px; margin-bottom: 6px; }
  .hero .hline { margin: 0; font: 600 19px/1.45 "Nunito", sans-serif; color: var(--text); }
  .hero .hline b { color: var(--yellow); }
  .hero .hline .m { color: #ff8a8a; }
  #hero.ph-hidden   { --accent: #ff7a7a; }
  #hero.ph-minigame { --accent: var(--cyan); }
  #hero.ph-rewards  { --accent: var(--yellow); }
  #hero.ph-voting   { --accent: var(--yellow); }
  #hero.ph-results  { --accent: #ff8a8a; }
  @media (max-width: 599px) { .hero { flex-direction: column; align-items: stretch; } }

  /* ----------------------------------------------------- week grid */
  .weekgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; }
  .weekgrid > .wide { grid-column: 1 / -1; }
  @media (max-width: 760px) { .weekgrid { grid-template-columns: 1fr; } }

  /* ---------------------------------------------------- rows & pills */
  .row { display: flex; align-items: center; gap: 10px; min-width: 0; margin: 0 0 8px; padding: 8px 12px;
         background: var(--panel-2); border: var(--line); border-radius: 16px; }
  .row:last-child { margin-bottom: 0; }
  .row .n { font: 600 16px/1.3 var(--head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .grow { flex: 1; min-width: 0; }
  .row .d { font-size: 14px; color: var(--muted); }
  .row .arrow { flex: 0 0 auto; font: 700 20px/1 var(--head); color: var(--red); text-shadow: var(--o2); }
  .row.mafia { background: #25060f; }
  .pill { display: inline-block; padding: 3px 12px; white-space: nowrap;
          font: 600 13px/1.4 var(--head); border: 2px solid var(--ink); border-radius: 999px;
          background: #3a4266; color: #d7ddf3; }
  .pill.wait { background: var(--yellow); color: var(--ink); }
  .pill.on { background: var(--green); color: var(--ink); }
  .pill.no { background: var(--red); color: #fff; }
  .pill.cy { background: var(--cyan); color: var(--ink); }
  .empty { font-size: 15px; font-style: italic; color: var(--faint); margin: 0; }
  .tally { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

  /* ------------------------------------------------ discuss & vote board */
  .vtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .vtop h2 { margin: 0; }
  .vclock { flex: 0 0 auto; padding: 6px 14px; font: 700 40px/1 var(--head);
            font-variant-numeric: tabular-nums; color: var(--yellow); text-shadow: var(--o2);
            background: #070a1c; border: var(--line); border-radius: 16px; box-shadow: var(--drop-sm); }
  .vclock.done { color: var(--red); }
  .vclock.paused { color: #9aa4c4; }
  .vboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin: 4px 0 16px; }
  .vtile { position: relative; min-width: 0; padding: 10px; background: var(--panel-2); border: var(--line);
           border-radius: 16px; box-shadow: var(--drop-sm); }
  .vtile.lead { border-color: var(--yellow); background: #2b2a45;
                box-shadow: 0 0 0 3px rgba(255, 210, 63, .35), 0 0 18px rgba(255, 210, 63, .35), var(--drop-sm); }
  .vtile.gone { border-color: var(--red); background: #3b0d1c; }
  .vhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .vmeta { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .vtags { display: flex; flex-wrap: wrap; gap: 4px; }
  .vhead .crew { width: 34px; height: 34px; }
  .vn { max-width: 100%; font: 600 15px/1.2 var(--head); overflow: hidden; overflow-wrap: anywhere; }
  .vtick { padding: 1px 8px; font: 600 12px/1.4 var(--head); color: var(--ink);
           background: var(--green); border: 2px solid var(--ink); border-radius: 999px; }
  .vtick.red { background: var(--red); color: #fff; }
  .vtick.cy { background: var(--cyan); }
  .vtick.civ { background: #2c6b4c; color: #d6ffe6; }
  .vc { position: absolute; top: -10px; right: -8px; min-width: 32px; padding: 0 6px; height: 32px; display: grid; place-items: center;
        font: 700 18px/1 var(--head); color: var(--ink); background: var(--yellow);
        border: var(--line); border-radius: 999px; }
  .vc:empty { display: none; }
  .vchips { display: flex; flex-wrap: wrap; gap: 4px; }
  .vchip { max-width: 100%; padding: 2px 8px 2px 4px; font: 700 13px/1.4 "Nunito", sans-serif;
           color: #dfe5fa; background: #2a3463; border: 2px solid var(--ink); border-radius: 999px;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; animation: vpop .25s ease-out; }
  .vchip b { color: var(--yellow); }
  .vchip.x-master { background: #0f4252; border-color: var(--cyan); }
  .vchip.x-extra { background: #33215e; border-color: var(--purple); }
  .vnone { font-size: 14px; font-style: italic; color: var(--faint); }
  @keyframes vpop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .legend .vchip { animation: none; }

  .lead-box { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; padding: 12px 14px;
              background: #2b2a45; border: 3px solid var(--yellow); border-radius: 16px; box-shadow: var(--drop-sm); }
  .lead-box .lk { font: 600 13px/1.3 var(--head); letter-spacing: .08em; text-transform: uppercase; color: var(--yellow); }
  .lead-box .lv { font: 700 20px/1.25 var(--head); color: #fff; text-shadow: var(--o2); overflow-wrap: anywhere; }
  .lead-box.tie { background: #141b42; }
  .waiting { margin: 0; font-size: 15px; color: var(--muted); }
  .waiting strong { color: #fff; }

  /* ------------------------------------------------ voted-out reveal */
  .reveal { margin: 0 -20px 16px; padding: 24px 16px; text-align: center; overflow: hidden;
            border-top: var(--line); border-bottom: var(--line);
            background:
              radial-gradient(1.5px 1.5px at 8% 22%, #fff 50%, transparent 51%),
              radial-gradient(1px 1px at 24% 70%, #fff 50%, transparent 51%),
              radial-gradient(2px 2px at 40% 14%, #fff 50%, transparent 51%),
              radial-gradient(1.5px 1.5px at 78% 30%, #fff 50%, transparent 51%),
              #060919; }
  .reveal .rk { display: inline-block; padding: 3px 14px; font: 600 14px/1.4 var(--head);
                color: var(--ink); background: var(--yellow); border: var(--line); border-radius: 999px; }
  .reveal .rfloat { margin: 16px 0 8px; transform: rotate(-14deg); }
  @media (prefers-reduced-motion: no-preference) {
    .reveal .rfloat { animation: eject 3s ease-in-out infinite; }
    @keyframes eject { 0%, 100% { transform: translate(-6px, 0) rotate(-14deg); }
                       50% { transform: translate(6px, -8px) rotate(10deg); } }
  }
  .reveal .rn { margin: 8px 0 4px; font: 700 26px/1.2 var(--head); color: #fff; text-shadow: var(--o2); overflow-wrap: anywhere; }
  .reveal .rr { font: 600 18px/1.3 var(--head); color: var(--muted); }
  .reveal .rr strong { display: block; margin-top: 4px; font: 700 44px/1.05 var(--head);
                       letter-spacing: .04em; text-transform: uppercase; color: #fff; text-shadow: var(--o3); }
  .reveal.mafia .rr strong { color: var(--red); }
  .reveal.civ .rr strong { color: var(--green); }
  .reveal.none .rn { margin-top: 12px; font-size: 26px; color: #d7ddf3; }

  .winner { margin: -20px -20px 0; padding: 32px 20px; text-align: center; border-radius: 17px; }
  .winner.good { background: #16784a; }
  .winner.bad { background: #b3182f; }
  .winner .wk { display: inline-block; margin-bottom: 12px; padding: 3px 14px; font: 600 14px/1.4 var(--head);
                letter-spacing: .08em; text-transform: uppercase; color: var(--ink);
                background: var(--yellow); border: var(--line); border-radius: 999px; }
  .winner h3 { margin: 0; font-size: clamp(36px, 7vw, 52px); color: #fff; text-shadow: var(--o3); }
  .card.end { padding-bottom: 0; overflow: hidden; }

  /* ------------------------------------------------------------ dossier */
  .grp { margin: 0 0 20px; min-width: 0; }
  .grp:last-child { margin-bottom: 0; }
  .grp-h { display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
           font: 700 17px/1.2 var(--head); color: #fff; text-shadow: var(--o2); }
  .grp-h .cnt { padding: 1px 10px; font: 600 13px/1.4 var(--head); color: var(--ink); background: var(--yellow);
                border: 2px solid var(--ink); border-radius: 999px; text-shadow: none; }
  .grp.g-mafia .grp-h { color: #ff8a8a; }
  .pcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .pc { min-width: 0; padding: 12px; background: var(--panel-2); border: var(--line);
        border-radius: 16px; box-shadow: var(--drop-sm); }
  .pc.is-mafia { background: #2a0914; }
  .pc.is-out { opacity: .85; }
  .pch { display: flex; align-items: center; gap: 10px; }

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import * as E from './engine.js';
import { PHASE_LABEL, ROLE_LABEL, ITEM_LABEL, MINIGAMES } from './content.js';

const URL = 'https://ashjitdpilxwcfhxamni.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzaGppdGRwaWx4d2NmaHhhbW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNDAxOTEsImV4cCI6MjEwNTYxNjE5MX0.wWTdrocCPlOWWN5CwTVi--OgWuVBEc99zWxWfVE_Gqk';

/* Own storage key, so observing never signs anyone out of the console,
   the player page or the spectator page in the same browser. */
const sb = createClient(URL, KEY, {
  auth: { storageKey: 'ampid-observer', persistSession: true }
});

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

/* Same avatar hash as player.html and spectator.html. */
const CREW = ['#ff5a5a','#4d8dff','#34d27b','#ff7ac8','#ff9a3c','#ffd23f','#a98bff','#38d9f5','#b6f04a','#f2f4ff','#c7844a','#9aa4bc'];
const crew = (id, cls = '') => { let h = 5381; for (const ch of String(id ?? '')) h = ((h * 33) ^ ch.charCodeAt(0)) >>> 0;
  return `<svg class="crew ${cls}" style="--c:${CREW[h % CREW.length]}" viewBox="0 0 64 64" aria-hidden="true"><use href="#crew"/></svg>`; };

/* --------------------------------------------------------------- text -- */
const PHASES = E.PHASE_ORDER.filter((p) => p !== 'CLOSED');
const PHASE_SHORT = { ATTENDANCE:'Start', HIDDEN_ACTIONS:'Actions', MINIGAME:'Game', MASTER:'Master',
                      REWARDS:'Rewards', RESOLUTION:'Result', VOTING:'Vote', RESULTS:'End' };
const PHASE_STYLE = { HIDDEN_ACTIONS:'hidden', MASTER:'hidden', MINIGAME:'minigame', REWARDS:'rewards',
                      RESOLUTION:'results', VOTING:'voting', RESULTS:'results' };
const HERO_TITLE = {
  CLOSED: 'Between sessions', ATTENDANCE: 'Checking in', HIDDEN_ACTIONS: 'Lights out',
  MINIGAME: 'Minigame', MASTER: 'Master awards', REWARDS: 'Tokens & shopping',
  RESOLUTION: 'The night is over', VOTING: 'Discuss & vote', RESULTS: 'Results', FINISHED: 'Game over'
};

const KIND = {
  kill:   ['🔪', '#ff4d4d'], vote:  ['🗳️', '#ffd23f'], shop:  ['🛒', '#a98bff'],
  token:  ['🪙', '#ffd23f'], master:['⭐', '#38d9f5'], night: ['🌙', '#4d8dff'],
  eject:  ['🚀', '#ff4d4d'], sab:   ['🔧', '#ff7ac8'], life:  ['✨', '#4ade80'],
  game:   ['🏆', '#4ade80'], phase: ['📍', '#38d9f5'], mini:  ['🎮', '#38d9f5'],
  role:   ['🃏', '#ff9a3c'], admin: ['🛠️', '#3a4266']
};
const AUDIT_KIND = {
  RESOLUTION_PUBLISHED: 'night', ELIMINATION: 'eject', PURCHASE: 'shop', PURCHASE_REJECTED: 'shop',
  TOKENS_AWARDED: 'token', MASTER_AWARD: 'master', MASTER_AWARDS_CONFIRMED: 'master',
  SABOTAGE_USED: 'sab', RESURRECTION: 'life', MAFIA_LEGACY: 'kill', GAME_FINISHED: 'game',
  GAME_RESUMED: 'game', SESSION_OPENED: 'phase', SESSION_CLOSED: 'phase', WHEEL_SPIN: 'mini',
  MINIGAME_LAUNCHED: 'mini', ROLES_DEALT: 'role', LATE_JOINER_ROLE: 'role',
  ITEM_EDITED: 'shop', ITEM_GRANTED: 'shop', MASTER_AWARD_REVOKED: 'master', MASTER_AWARDS_UNLOCKED: 'master'
};
const prettyType = (t) => String(t || 'Update').toLowerCase().replace(/_/g, ' ')
  .replace(/^./, (c) => c.toUpperCase());

/* -------------------------------------------------------------- state -- */
let blob = { game: { status: 'CLOSED', currentRound: 0, settings: {} } };
let audit = [];
let players = [];
let actions = [];
let ballots = [];
let purchases = [];
let voteTimer = null;
let skew = 0;
let syncError = '';
let timer = null;
let loaded = false;
let signedInAs = '';

let liveEvents = [];
let liveSeq = 0;
let prevActs = null, prevVotes = null, seenBuys = null, prevPhase = null, trackRound = null;
let tlScope = 'week';
let seenTl = new Set();
let firstTl = true;
let veil = sessionStorage.getItem('ampid-observer-veil') === '1';

/* ------------------------------------------------------------ helpers -- */
const phase = () => blob.game?.status ?? 'CLOSED';
const round = () => blob.game?.currentRound ?? 0;
const settings = () => ({ ...E.DEFAULT_SETTINGS, ...(blob.game?.settings || {}) });
const byId = (id) => players.find((p) => p.id === id);
const nameOf = (id) => byId(id)?.displayName ?? 'someone';
const roleOf = (id) => ROLE_LABEL[byId(id)?.role] ?? '';
const who = (id) => `${crew(id, 'mini')}${esc(nameOf(id))}`;
const B = (id) => `<b>${esc(nameOf(id))}</b>`;
const present = () => players.filter(E.isPresent);
const isMafia = (p) => p && p.role === E.ROLE.MAFIA;
const idx = (p) => E.PHASE_ORDER.indexOf(p);
const reached = (p) => phase() === 'FINISHED' || idx(phase()) >= idx(p);
const isNow = (...ps) => ps.includes(phase());
const fmtTime = (iso) => { const t = Date.parse(iso); return Number.isFinite(t)
  ? new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''; };
const listNames = (ids) => ids.map((id) => B(id)).join(', ');

const gameState = () => ({
  game: { ...blob.game, settings: settings() },
  players,
  currentMaster: blob.currentMaster || E.blankMasterAwards()
});

const toPlayer = (r) => {
  const role = E.RETIRED_ROLES.includes(r.role) ? E.ROLE.CIVILIAN : r.role;
  return {
    id: r.id, displayName: r.display_name, role, alignment: E.alignmentOf(role),
    lifeStatus: r.life_status, attendanceStatus: r.attendance_status,
    rewardTokens: r.reward_tokens ?? 0, spiritPoints: r.spirit_points ?? 0,
    inventory: Array.isArray(r.inventory) ? r.inventory : [],
    flags: r.flags ?? {}, joinedRound: r.joined_round ?? 0
  };
};

const usable = (p, type) => !!p && (p.inventory || []).some((i) =>
  i.rewardType === type && i.status === 'OWNED' &&
  (i.eligibleFromRound == null || i.eligibleFromRound <= round()) &&
  (i.expiresRound == null || i.expiresRound >= round()));
const staged = (p, type) => !!p && (p.inventory || []).some((i) =>
  i.rewardType === type && i.status === 'STAGED' && i.stagedRound === round());
const masterX2 = () => E.masterDoubleVoteIds(blob.currentMaster || {});
const weightOf = (id) => 1 + (staged(byId(id), E.ITEM.EXTRA_VOTE) ? 1 : 0) + (masterX2().includes(id) ? 1 : 0);
const sabotage = () => (players.length ? E.sabotageFor(gameState()) : null);

/* Admin-entered picks win, otherwise the player's own. Same rule as live.js. */
function mergeActs(blobActs, rows) {
  const m = new Map();
  for (const a of blobActs || []) if (a && a.actorId) m.set(a.actorId, a);
  for (const r of rows || []) {
    const cur = m.get(r.actor_id);
    if (cur && cur.source === 'ADMIN') continue;
    m.set(r.actor_id, { actorId: r.actor_id, type: r.type, targetId: r.target_id ?? null,
                        submittedAt: r.submitted_at, source: 'PLAYER' });
  }
  return [...m.values()].filter((a) => a.targetId);
}

/* --------------------------------------------------------------- load -- */
async function load() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  signedInAs = user.email || '';
  $('go').disabled = true;
  const ok = await refresh(true);
  $('go').disabled = false;
  if (!ok) return;
  loaded = true;
  $('loginCard').classList.add('hide');
  $('wrap').classList.remove('narrow');
  ['live', 'phaseChip', 'veilBtn'].forEach((id) => $(id).classList.remove('hide'));
  $('who').textContent = signedInAs ? `Signed in as ${signedInAs}` : '';
  applyVeil();
  schedule();
}

function schedule() {
  clearTimeout(timer);
  const busy = ['HIDDEN_ACTIONS', 'REWARDS', 'VOTING', 'MASTER'].includes(phase());
  timer = setTimeout(async () => {
    try { await refresh(); } catch (err) { console.error('[observer] refresh failed', err); }
    schedule();
  }, busy ? 2500 : 5000);
}

async function refresh(first = false) {
  const { data, error } = await sb.rpc('observer_snapshot');
  if (error) {
    if (first) {
      const msg = explainError(error.message);
      await sb.auth.signOut();
      fail(msg);
      return false;
    }
    syncError = error.message;
    paintSyncErr();
    return false;
  }
  syncError = '';
  ingest(data || {});
  track();
  paint();
  return true;
}

function explainError(m) {
  const acct = signedInAs || 'This account';
  if (/NOT_OBSERVER/.test(m)) return `${acct} signed in, but is not on the observer list. Put that exact email in step 3 of observer.sql, run it, and check the verdict column.`;
  if (/OBSERVER_IS_PLAYER/.test(m)) return `${acct} is linked to a player seat, so it can never see everyone’s secrets. Use a separate observer account.`;
  if (/observer_snapshot|does not exist|Could not find the function/i.test(m)) return 'The observer screen is not installed yet. Run observer.sql in the Supabase SQL Editor.';
  return m;
}

function ingest(data) {
  blob = data.blob && typeof data.blob === 'object' ? data.blob : {};
  if (!blob.game) blob.game = { status: 'CLOSED', currentRound: 0, settings: {} };
  audit = Array.isArray(data.audit) ? data.audit : [];
  players = (data.players || []).map(toPlayer);
  actions = mergeActs(blob.currentActions, data.actions);
  const rows = Array.isArray(data.ballots) ? data.ballots : [];
  ballots = rows.length
    ? rows.map((b) => ({ voterId: b.voter_id, targetId: b.target_id, at: b.submitted_at }))
    : (blob.currentBallots || []).map((b) => ({ voterId: b.voterId, targetId: b.targetId, at: b.submittedAt }));
  purchases = Array.isArray(data.purchases) ? data.purchases : [];
  voteTimer = data.vote_timer || null;
  if (data.server_time) skew = Date.parse(data.server_time) - Date.now();
}

/* ------------------------------------------------- live timeline diffs -- */
function push(e) {
  const ev = { id: 'l' + (++liveSeq), round: round(), ...e };
  ev.at = e.at || new Date().toISOString();
  liveEvents.unshift(ev);
  liveEvents = liveEvents.slice(0, 400);
}

/* The first refresh of a week seeds from what is already there, using the
   real submission times. After that, every change is announced live. */
function track() {
  const r = round();
  const ph = phase();
  if (trackRound !== r) { prevActs = null; prevVotes = null; seenBuys = null; trackRound = r; }
  if (prevPhase && prevPhase !== ph) push({ kind: 'phase', html: `Phase moved to <b>${esc(PHASE_LABEL[ph] ?? ph)}</b>` });
  prevPhase = ph;

  const kills = actions.filter((a) => a.type === E.ACTION.MAFIA_KILL_VOTE);
  const actNow = new Map(kills.map((a) => [a.actorId, a.targetId]));
  const killLine = (actor, target) => `${who(actor)} <i>(Mafia)</i> chose to kill <b>${esc(nameOf(target))}</b>`;
  if (prevActs === null) {
    for (const a of kills) push({ kind: 'kill', at: a.submittedAt, html: killLine(a.actorId, a.targetId) });
  } else {
    for (const [actor, target] of actNow) {
      const before = prevActs.get(actor);
      if (!before) push({ kind: 'kill', html: killLine(actor, target) });
      else if (before !== target) push({ kind: 'kill',
        html: `${who(actor)} <i>(Mafia)</i> switched their kill from ${esc(nameOf(before))} to <b>${esc(nameOf(target))}</b>` });
    }
    for (const [actor] of prevActs) if (!actNow.has(actor)) push({ kind: 'kill', html: `${who(actor)} <i>(Mafia)</i> withdrew their kill pick` });
  }
  prevActs = actNow;

  const voteNow = new Map(ballots.map((b) => [b.voterId, b.targetId]));
  const sab = sabotage();
  const silencedId = sab && sab.status === 'ACTIVE' ? sab.targetId : null;
  const tag = (id) => (id === silencedId ? ' <i>(sabotaged — will not count)</i>' : '');
  if (prevVotes === null) {
    for (const b of ballots) push({ kind: 'vote', at: b.at, html: `${who(b.voterId)} voted for <b>${esc(nameOf(b.targetId))}</b>${tag(b.voterId)}` });
  } else {
    for (const [voter, target] of voteNow) {
      const before = prevVotes.get(voter);
      if (!before) push({ kind: 'vote', html: `${who(voter)} voted for <b>${esc(nameOf(target))}</b>${tag(voter)}` });
      else if (before !== target) push({ kind: 'vote',
        html: `${who(voter)} switched their vote from ${esc(nameOf(before))} to <b>${esc(nameOf(target))}</b>${tag(voter)}` });
    }
    for (const [voter] of prevVotes) if (!voteNow.has(voter)) push({ kind: 'vote', html: `${who(voter)} took their vote back` });
  }
  prevVotes = voteNow;

  if (seenBuys === null) seenBuys = new Set();
  for (const p of purchases) {
    if (seenBuys.has(p.id)) continue;
    seenBuys.add(p.id);
    const item = ITEM_LABEL[p.reward_type] ?? p.reward_type;
    push({ kind: p.reward_type === 'SABOTAGE' ? 'sab' : 'shop', at: p.created_at,
           html: `${who(p.player_id)} <i>(${esc(roleOf(p.player_id))})</i> asked to buy <b>${esc(item)}</b>${
             p.target_id ? ` on ${esc(nameOf(p.target_id))}` : ''}` });
  }
}

/* -------------------------------------------------------------- paint -- */
function paint() {
  const ph = phase();
  $('week').textContent = round() ? `Week ${round()}` : 'Not started';
  $('phaseChip').textContent = PHASE_LABEL[ph] ?? ph;
  paintSyncErr();
  paintProgress();
  paintHero();
  $('weekCards').innerHTML = ph === 'CLOSED' ? '' : [nightCard(), minigameCard(), masterCard(), shopCard(), voteCard()].join('');
  paintDossier();
  paintBalance();
  paintTimeline();
  $('foot').textContent = 'Updates automatically. Last checked '
    + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function paintSyncErr() {
  $('syncErr').innerHTML = syncError
    ? `<div class="err">Having trouble updating: ${esc(syncError)}. Showing the last thing we saw.</div>` : '';
}

function paintProgress() {
  const host = $('phaseProgress');
  const ph = phase();
  if (ph === 'CLOSED' || ph === 'FINISHED') { host.classList.add('hide'); host.innerHTML = ''; return; }
  const cur = PHASES.indexOf(ph);
  host.classList.remove('hide');
  host.innerHTML = PHASES.map((p, i) =>
    `<div class="step ${i < cur ? 'done' : i === cur ? 'active' : ''}"><span class="txt">${PHASE_SHORT[p]}</span></div>`).join('');
}

/* ------------------------------------------------------- projections -- */
function nightProjection() {
  const valid = actions.filter((a) => {
    const actor = byId(a.actorId), target = byId(a.targetId);
    return a.type === E.ACTION.MAFIA_KILL_VOTE && actor && target && E.isPresent(actor) && E.isPresent(target);
  });
  const tally = {};
  for (const a of valid) tally[a.targetId] = (tally[a.targetId] || 0) + 1;
  const top = Math.max(0, ...Object.values(tally));
  const leaders = top ? Object.keys(tally).filter((id) => tally[id] === top) : [];
  const target = leaders.length === 1 ? leaders[0] : null;
  return { valid, tally, leaders, tie: leaders.length > 1, target,
           blocked: target ? usable(byId(target), E.ITEM.TEMP_IMMUNITY) : false };
}

function nightLine(np) {
  if (np.target && np.blocked) return `The Mafia are going for ${B(np.target)} &mdash; but ${esc(nameOf(np.target))} holds <b>Temporary Immunity</b> and will survive.`;
  if (np.target) return `The Mafia are going for ${B(np.target)}.`;
  if (np.tie) return `The Mafia are split between ${listNames(np.leaders)}. A tie is broken at random.`;
  return 'The Mafia have not picked anyone yet.';
}

const voteProjection = () => E.resolveVote(gameState(),
  ballots.map((b) => ({ voterId: b.voterId, targetId: b.targetId })), blob.currentMaster || {});

/* -------------------------------------------------------------- hero --- */
function heroLine() {
  const ph = phase();
  const mg = MINIGAMES.find((m) => m.id === blob.currentMinigameId);
  const np = nightProjection();
  switch (ph) {
    case 'CLOSED': {
      const last = (blob.rounds || []).at(-1);
      if (last) return `Week ${esc(last.number)} recap: ${esc(last.publicSummary)}`;
      return players.length
        ? `${players.filter(E.isProfileActive).length} crewmates on the roster. Nothing moves until Hunter opens a week.`
        : 'No crew yet.';
    }
    case 'ATTENDANCE': {
      const away = players.filter((p) => E.isAlive(p) && p.attendanceStatus === E.ATTENDANCE.DORMANT).length;
      return `<b>${present().length}</b> here this week${away ? `, <b>${away}</b> away` : ''}.`;
    }
    case 'HIDDEN_ACTIONS':
      return `<b>${np.valid.length} of ${present().filter(isMafia).length}</b> Mafia have picked. ${nightLine(np)}`;
    case 'MINIGAME': {
      const victim = !blob.pendingPublicEvent && np.target && !np.blocked
        ? ` ${B(np.target)} is playing &mdash; and has no idea they’ve already been killed.` : '';
      return `${mg ? `Now playing <b>${esc(mg.name)}</b>.` : 'Picking a game.'}${victim}`;
    }
    case 'MASTER':
      return blob.currentMaster?.confirmed
        ? 'The Master has confirmed this week’s awards.'
        : 'The Master is choosing Most engaged and Best team player.';
    case 'REWARDS': {
      const pending = purchases.filter((p) => p.status === 'PENDING').length;
      return `${blob.currentRewardsPaid ? 'Minigame tokens are paid.' : 'Minigame tokens are being handed out.'}${
        pending ? ` <b>${pending}</b> shop request${pending === 1 ? '' : 's'} waiting on Hunter.` : ''}`;
    }
    case 'RESOLUTION':
      return blob.pendingPublicEvent
        ? `Announced: <b>${esc(blob.pendingPublicEvent.text)}</b>`
        : `About to be announced. ${nightLine(np)}`;
    case 'VOTING': {
      const sab = sabotage();
      const sil = sab && sab.status === 'ACTIVE' ? sab.targetId : null;
      const eligible = present().filter((p) => p.id !== sil);
      const voted = new Set(ballots.filter((b) => b.voterId !== sil && byId(b.voterId) && E.isPresent(byId(b.voterId))).map((b) => b.voterId));
      const proj = voteProjection();
      const line = proj.eliminated
        ? `If time ran out now, ${B(proj.eliminated)} would be ejected &mdash; and they’re <b class="m">${esc(roleOf(proj.eliminated))}</b>.`
        : proj.tie ? 'Right now it’s a tie &mdash; nobody would leave.' : 'No votes yet.';
      return `<b>${voted.size} of ${eligible.length}</b> have voted. ${line}`;
    }
    case 'RESULTS': {
      const res = blob.currentVoteResult;
      if (!res) return 'Waiting for the tally.';
      return res.eliminated
        ? `${B(res.eliminated)} was ejected. They were <b class="m">${esc(ROLE_LABEL[res.revealedRole] ?? res.revealedRole)}</b>.`
        : res.tie ? 'The vote was tied. Nobody was ejected.' : 'Nobody was ejected.';
    }
    default: return '';
  }
}

function paintHero() {
  const ph = phase();
  const host = $('hero');
  host.className = 'ph-' + (PHASE_STYLE[ph] ?? 'closed');
  if (ph === 'FINISHED') {
    host.innerHTML = `<div class="card now end"><div class="winner ${blob.game.winner === 'GOOD' ? 'good' : 'bad'}">
      <div class="wk">Game over &middot; after ${round()} week${round() === 1 ? '' : 's'}</div>
      <h3>${blob.game.winner === 'GOOD' ? 'The town wins' : 'The Mafia win'}</h3></div></div>`;
    return;
  }
  const left = voteLeft();
  const clock = ph === 'VOTING' && left !== null
    ? `<div class="vclock jsClock${clockClass(left)}">${fmtClock(left)}</div>` : '';
  host.innerHTML = `<div class="card now hero">
    <div class="hbody">
      <div class="hk">${round() ? `Week ${round()}` : 'Pre-game'} &middot; happening now</div>
      <h3>${esc(HERO_TITLE[ph] ?? ph)}</h3>
      <p class="hline">${heroLine()}</p>
    </div>${clock}</div>`;
}

/* ------------------------------------------------------- week cards --- */
const head = (title, live, extra = '') =>
  `<h2>${title}${live ? ' <span class="livetag">Live</span>' : ''}<span class="sp"></span>${extra}</h2>`;

function nightCard() {
  if (!reached('HIDDEN_ACTIONS')) return '';
  const live = isNow('HIDDEN_ACTIONS', 'MINIGAME', 'RESOLUTION') && !(phase() === 'RESOLUTION' && blob.pendingPublicEvent);
  const np = nightProjection();
  const mafia = players.filter((p) => isMafia(p) && E.isAlive(p));
  const picks = new Map(actions.filter((a) => a.type === E.ACTION.MAFIA_KILL_VOTE).map((a) => [a.actorId, a]));
  const rows = mafia.length ? mafia.map((m) => {
    const a = picks.get(m.id);
    return `<div class="row mafia">${crew(m.id)}<span class="n">${esc(m.displayName)}</span>
      <span class="arrow">&rarr;</span>
      ${a ? `${crew(a.targetId)}<span class="n grow">${esc(nameOf(a.targetId))}</span>
             ${a.source === 'ADMIN' ? '<span class="pill">Entered by Hunter</span>' : ''}`
          : `<span class="grow vnone">${E.isPresent(m) ? 'Still choosing…' : 'Away this week'}</span>`}
    </div>`;
  }).join('') : '<p class="empty">No living Mafia.</p>';
  const tallyHtml = Object.keys(np.tally).length
    ? `<div class="tally">${Object.entries(np.tally).sort((a, b) => b[1] - a[1]).map(([id, n]) =>
        `<span class="vchip">${crew(id, 'mini')}${esc(nameOf(id))} <b>${n}</b></span>`).join('')}</div>` : '';
  const shielded = present().filter((p) => usable(p, E.ITEM.TEMP_IMMUNITY));
  const ev = blob.pendingPublicEvent;
  const outcome = ev
    ? `<div class="announce" style="margin-top:16px"><span class="ak">Announced to everyone</span>
        <span class="at">${esc(ev.text)}</span>
        ${ev.type === 'SURVIVED' ? '<div class="truth">The secret: Temporary Immunity saved them.</div>' : ''}
        ${ev.type === 'DEATH' ? `<div class="truth">They were ${esc(roleOf(ev.playerId))}. Nobody else knows that.</div>` : ''}
      </div>`
    : `<div class="note" style="margin:16px 0 0">${nightLine(np)} Nobody finds out until the announcement after the minigame.</div>`;
  return `<div class="card wide${live ? ' now' : ''}">
    ${head('🔪 The night', live, '<span class="secret">Secret</span>')}
    ${rows}${tallyHtml}
    ${shielded.length ? `<p class="hint" style="margin:12px 0 0">Protected by Temporary Immunity this week: ${listNames(shielded.map((p) => p.id))}.</p>` : ''}
    ${outcome}
  </div>`;
}

function minigameCard() {
  if (!reached('MINIGAME')) return '';
  const live = isNow('MINIGAME', 'REWARDS');
  const mg = MINIGAMES.find((m) => m.id === blob.currentMinigameId);
  const spin = [...audit].reverse().find((a) => a.eventType === 'WHEEL_SPIN' && a.round === round());
  const winners = blob.currentWinners || [];
  const paid = !!blob.currentRewardsPaid;
  const sp = settings().spiritPointsMinigameWin;
  return `<div class="card${live ? ' now' : ''}">
    ${head('🎮 Minigame', live)}
    ${mg ? `<div class="row"><div class="grow"><div class="n">${esc(mg.name)}</div>
        <div class="d">${esc(mg.instructions)}</div></div>
        <span class="pill cy">${mg.format === 'TEAM' ? 'Team' : 'Solo'}</span></div>`
      : '<p class="empty">No game launched yet.</p>'}
    ${spin ? `<p class="hint" style="margin:10px 0 0">🎡 ${esc(spin.summary)}</p>` : ''}
    <div class="sub">Winners</div>
    ${winners.length ? winners.map((id) => {
      const p = byId(id);
      const spirit = p && p.lifeStatus === E.LIFE.SPIRIT;
      return `<div class="row">${crew(id, spirit ? 'ghost' : '')}<span class="n grow">${esc(nameOf(id))}</span>
        <span class="pill ${paid ? 'on' : 'wait'}">${spirit ? `+${sp} Spirit` : '+1 token'}${paid ? ' paid' : ' pending'}</span></div>`;
    }).join('') : `<p class="empty">${reached('REWARDS') ? 'Nobody ticked as a winner yet.' : 'Decided after the game.'}</p>`}
  </div>`;
}

function masterCard() {
  if (!settings().masterEnabled || !reached('MASTER')) return '';
  const live = isNow('MASTER');
  const m = blob.currentMaster || E.blankMasterAwards();
  const awards = m.awards || [];
  return `<div class="card${live ? ' now' : ''}">
    ${head('⭐ Master awards', live, `<span class="pill ${m.confirmed ? 'on' : 'wait'}">${m.confirmed ? 'Confirmed' : 'Choosing'}</span>`)}
    ${awards.map((a) => `<div class="row">
        ${a.playerId ? crew(a.playerId) : ''}
        <div class="grow"><div class="n">${esc(a.title)}</div>
          <div class="d">${a.playerId ? esc(nameOf(a.playerId)) : (m.confirmed ? 'Not awarded' : 'Nobody picked yet')}</div></div>
        ${a.playerId ? `<span class="pill ${a.prize === 'TOKEN' ? 'wait' : 'cy'}">${a.prize === 'TOKEN' ? '+1 token' : 'Double vote ×2'}</span>` : ''}
      </div>`).join('')}
    ${!m.confirmed && awards.some((a) => a.playerId) ? '<p class="hint" style="margin:10px 0 0">Not final until the Master confirms.</p>' : ''}
  </div>`;
}

function shopCard() {
  if (!reached('REWARDS')) return '';
  const live = isNow('REWARDS');
  const statusPill = (s) => s === 'ACCEPTED' ? '<span class="pill on">Bought</span>'
    : s === 'REJECTED' ? '<span class="pill no">Refused</span>' : '<span class="pill wait">Waiting</span>';
  /* Purchases Hunter entered by hand never went through the request table,
     so they only exist in the log. Show them too. */
  const manual = audit.filter((a) => a.round === round() && a.eventType === 'PURCHASE'
    && !purchases.some((p) => p.status === 'ACCEPTED' && p.player_id === a.actorId));
  return `<div class="card${live ? ' now' : ''}">
    ${head('🛒 The shop', live, '<span class="secret">Secret</span>')}
    ${purchases.map((p) => `<div class="row${isMafia(byId(p.player_id)) ? ' mafia' : ''}">
        ${crew(p.player_id)}
        <div class="grow"><div class="n">${esc(nameOf(p.player_id))} <span class="d">(${esc(roleOf(p.player_id))})</span></div>
          <div class="d">${esc(ITEM_LABEL[p.reward_type] ?? p.reward_type)}${p.target_id ? ` &rarr; <b>${esc(nameOf(p.target_id))}</b>` : ''}${
            p.status === 'REJECTED' && p.decided_reason ? ` &middot; ${esc(p.decided_reason)}` : ''}</div></div>
        ${statusPill(p.status)}</div>`).join('')}
    ${manual.length ? `${purchases.length ? '<div class="sub">Entered by Hunter</div>' : ''}${manual.map((a) =>
        `<div class="row">${a.actorId ? crew(a.actorId) : ''}<span class="grow d">${esc(a.summary)}</span><span class="pill on">Bought</span></div>`).join('')}` : ''}
    ${!purchases.length && !manual.length ? `<p class="empty">${live ? 'Nobody has asked for anything yet.' : 'Nothing bought this week.'}</p>` : ''}
  </div>`;
}

/* ------------------------------------------------------------- vote --- */
const fmtClock = (sec) => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
function voteLeft() {
  const t = voteTimer;
  if (!t || t.round !== round()) return null;
  if (t.ends_at) return Math.max(0, Math.ceil((Date.parse(t.ends_at) - (Date.now() + skew)) / 1000));
  return Math.max(0, t.remaining_seconds ?? 0);
}
const clockRunning = () => !!(voteTimer && voteTimer.round === round() && voteTimer.ends_at);
const clockClass = (left) => (left === 0 ? ' done' : clockRunning() ? '' : ' paused');

function sabotageNote(sab) {
  if (!sab) return '';
  const t = B(sab.targetId), o = B(sab.ownerId);
  const text = {
    ACTIVE:  `${t} has been sabotaged and cannot vote. Bought by ${o} <span class="secret">Secret</span>`,
    BLOCKED: `${o} tried to sabotage ${t}, but Temporary Immunity blocked it. Nobody else knows.`,
    WAITING: `${o}’s Sabotage on ${t} is waiting &mdash; ${esc(nameOf(sab.targetId))} is away this week.`,
    WASTED:  `${o}’s Sabotage was aimed at ${t}, who is already out. It does nothing.`
  }[sab.status];
  return text ? `<div class="note">🔧 ${text}</div>` : '';
}

function voteCard() {
  if (!reached('VOTING')) return '';
  const ph = phase();
  const res = blob.currentVoteResult || null;
  const final = ph !== 'VOTING';
  if (final && !res) return '';
  const st = settings();
  const sab = sabotage();
  const sil = final ? (res.sabotaged || null) : (sab && sab.status === 'ACTIVE' ? sab.targetId : null);
  const outId = final ? (res.eliminated || null) : null;

  let pool = present();
  if (outId && !pool.some((p) => p.id === outId) && byId(outId)) pool = [...pool, byId(outId)];
  const inPool = new Set(pool.map((p) => p.id));
  const counted = ballots.filter((b) => b.voterId !== sil && byId(b.voterId) && inPool.has(b.targetId)
    && (final || E.isPresent(byId(b.voterId))));
  const byT = {};
  for (const b of counted) (byT[b.targetId] ||= []).push(b.voterId);

  const shielded = new Set(final ? (res.shielded || [])
    : st.tempImmunityCoversVote ? present().filter((p) => usable(p, E.ITEM.TEMP_IMMUNITY)).map((p) => p.id) : []);
  const total = (id) => final ? (res.totals?.[id] ?? 0) : (byT[id] || []).reduce((s, v) => s + weightOf(v), 0);
  const top = Math.max(0, ...pool.filter((p) => !shielded.has(p.id)).map((p) => total(p.id)));
  const voted = new Set(counted.map((b) => b.voterId));
  const eligible = present().filter((p) => p.id !== sil);
  const waiting = eligible.filter((p) => !voted.has(p.id));
  const x2 = masterX2();

  const chip = (v) => {
    const extra = staged(byId(v), E.ITEM.EXTRA_VOTE);
    const mst = x2.includes(v);
    const w = 1 + (extra ? 1 : 0) + (mst ? 1 : 0);
    return `<span class="vchip${extra ? ' x-extra' : ''}${mst && !extra ? ' x-master' : ''}">${crew(v, 'mini')}${esc(nameOf(v))}${w > 1 ? ` <b>×${w}</b>` : ''}</span>`;
  };

  const tiles = pool.map((p) => {
    const vs = byT[p.id] || [];
    const t = total(p.id);
    const isOut = outId === p.id;
    const cls = ['vtile', t && t === top && !shielded.has(p.id) && !isOut ? 'lead' : '', isOut ? 'gone' : ''].filter(Boolean).join(' ');
    const tags = [
      `<span class="vtick ${isMafia(p) ? 'red' : 'civ'}">${esc(ROLE_LABEL[p.role] ?? p.role)}</span>`,
      isOut ? '<span class="vtick red">Ejected</span>' : '',
      p.id === sil ? '<span class="vtick red">Sabotaged</span>' : '',
      shielded.has(p.id) ? '<span class="vtick cy">Immune</span>' : '',
      voted.has(p.id) ? '<span class="vtick">Voted</span>' : ''
    ].join('');
    return `<div class="${cls}">
      <div class="vhead">${crew(p.id, isOut ? 'ghost' : '')}
        <span class="vmeta"><span class="vn">${esc(p.displayName)}</span><span class="vtags">${tags}</span></span>
        <span class="vc">${t || ''}</span></div>
      <div class="vchips">${vs.length ? vs.map(chip).join('') : '<span class="vnone">No votes</span>'}</div>
    </div>`;
  }).join('');

  let lead = '';
  if (!final) {
    const proj = voteProjection();
    lead = proj.eliminated
      ? `<div class="lead-box">${crew(proj.eliminated)}<div><div class="lk">If time ran out now</div>
          <div class="lv">${esc(nameOf(proj.eliminated))} is ejected &middot; ${esc(roleOf(proj.eliminated))}</div></div></div>`
      : proj.tie ? '<div class="lead-box tie"><div><div class="lk">If time ran out now</div><div class="lv">Tie &mdash; nobody leaves</div></div></div>' : '';
  }

  const left = voteLeft();
  const clock = !final && left !== null ? `<div class="vclock jsClock${clockClass(left)}">${fmtClock(left)}</div>` : '';
  return `<div class="card wide${final ? '' : ' now'}">
    <div class="vtop">${head(final ? '🗳️ Final votes' : '🗳️ Discuss &amp; vote', !final)}${clock}</div>
    ${final ? revealHtml(res) : ''}
    ${sabotageNote(sab)}
    ${!final && left !== null && !clockRunning() && left > 0 ? '<div class="note">The clock is paused.</div>' : ''}
    ${lead}
    <div class="legend">
      <span>Numbers are <b>real weighted totals</b>.</span>
      <span class="vchip x-extra">Extra Vote <b>×2</b></span><span>secret item</span>
      <span class="vchip x-master">Master <b>×2</b></span><span>public award</span>
    </div>
    <div class="vboard">${tiles}</div>
    <p class="waiting">${voted.size} of ${eligible.length} have voted.${
      !final && waiting.length ? ` Still to vote: <strong>${waiting.map((p) => esc(p.displayName)).join(', ')}</strong>.` : ''}</p>
  </div>`;
}

function revealHtml(res) {
  if (!res.eliminated) {
    return `<div class="reveal none"><div class="rk">Week ${round()} &middot; the vote</div>
      <div class="rn">${res.tie ? 'Tied &mdash; nobody was ejected' : 'Nobody was ejected'}</div></div>`;
  }
  const role = res.revealedRole || '';
  return `<div class="reveal ${role === 'MAFIA' ? 'mafia' : role ? 'civ' : ''}">
    <div class="rk">Week ${round()} &middot; ejected</div>
    <div class="rfloat">${crew(res.eliminated, 'big')}</div>
    <div class="rn">${esc(nameOf(res.eliminated))} was ejected</div>
    ${role ? `<div class="rr">They were <strong>${esc(ROLE_LABEL[role] ?? role)}</strong></div>` : ''}
  </div>`;
}

/* ---------------------------------------------------------- dossier --- */
function itemChips(p) {
  const r = round();
  const chips = (p.inventory || []).filter((i) => i.status !== 'USED' || i.usedRound === r).map((i) => {
    const label = esc(ITEM_LABEL[i.rewardType] ?? i.rewardType);
    const target = i.targetId ? ` &rarr; ${esc(nameOf(i.targetId))}` : '';
    if (i.status === 'USED') return `<span class="it used">${label}${target} &middot; used this week</span>`;
    if (i.status === 'STAGED') return `<span class="it used">${label}${target} &middot; in use</span>`;
    if (i.expiresRound != null && i.expiresRound < r) return `<span class="it">${label}${target} &middot; expired</span>`;
    if (i.eligibleFromRound != null && i.eligibleFromRound > r) return `<span class="it">${label}${target} &middot; from week ${i.eligibleFromRound}</span>`;
    return `<span class="it ready">${label}${target} &middot; ${i.expiresRound != null ? 'active this week' : 'ready'}</span>`;
  });
  const sab = sabotage();
  if (sab && sab.status === 'ACTIVE' && sab.targetId === p.id && reached('VOTING') && phase() !== 'CLOSED') chips.push('<span class="it bad">Sabotaged this week</span>');
  if (masterX2().includes(p.id)) chips.push('<span class="it flag">Master ×2 this week</span>');
  return chips.join('');
}

function personCard(p) {
  const spirit = p.lifeStatus === E.LIFE.SPIRIT;
  const left = !E.isProfileActive(p);
  const away = !spirit && !left && p.attendanceStatus === E.ATTENDANCE.DORMANT;
  const role = `<span class="rb ${isMafia(p) ? 'r-mafia' : 'r-civ'}">${esc(ROLE_LABEL[p.role] ?? p.role)}</span>`;
  const status = left ? '<span class="rb st">Left</span>' : spirit ? '<span class="rb st">Spirit</span>'
    : away ? '<span class="rb away">Away</span>' : '';
  const items = itemChips(p);
  const cls = ['pc', isMafia(p) && !spirit ? 'is-mafia' : '', spirit || left ? 'is-out' : ''].filter(Boolean).join(' ');
  return `<div class="${cls}">
    <div class="pch">${crew(p.id, spirit || left ? 'ghost' : '')}
      <div class="pcm"><div class="pcn">${esc(p.displayName)}</div><div class="pct">${role}${status}</div></div></div>
    <div class="mstats">
      <span class="ms" title="Reward tokens"><svg viewBox="0 0 36 36"><use href="#coin"/></svg>${p.rewardTokens}</span>
      ${spirit || p.spiritPoints ? `<span class="ms" title="Spirit points"><svg viewBox="0 0 36 36"><use href="#ghost"/></svg>${p.spiritPoints}</span>` : ''}
    </div>
    ${items ? `<div class="items">${items}</div>` : ''}
  </div>`;
}

function paintDossier() {
  const host = $('dossier');
  if (!players.length) { host.innerHTML = ''; return; }
  const sort = (a, b) => a.displayName.localeCompare(b.displayName);
  /* Group classes are g-* on purpose: a bare "crew" class is the avatar
     style (36px wide) and squashed the whole group. */
  const groups = [
    ['The Mafia', 'mafia', players.filter((p) => E.isAlive(p) && isMafia(p)).sort(sort)],
    ['The crew', 'town', players.filter((p) => E.isAlive(p) && !isMafia(p)).sort(sort)],
    ['Spirits', 'spirits', players.filter(E.isSpirit).sort(sort)],
    ['Left the game', 'gone', players.filter((p) => !E.isProfileActive(p)).sort(sort)]
  ].filter(([, , list]) => list.length);
  host.innerHTML = `<div class="card">
    <h2>👥 Every crewmate <span class="sp"></span><span class="secret">Secret</span></h2>
    ${groups.map(([title, cls, list]) => `<div class="grp g-${cls}">
      <div class="grp-h">${title} <span class="cnt">${list.length}</span></div>
      <div class="pcs">${list.map(personCard).join('')}</div></div>`).join('')}
  </div>`;
}

/* ---------------------------------------------------------- balance --- */
function paintBalance() {
  const host = $('balance');
  if (!players.length) { host.innerHTML = ''; return; }
  const g = blob.game;
  const { activeMafia, activeGood } = E.checkEndgame(gameState());
  const total = Math.max(1, activeMafia + activeGood);
  const gap = activeGood - activeMafia;
  const legacy = g.legacyUsed ? 'Used' : g.countdownDisablesLegacy ? 'Switched off' : 'Available';
  const tokens = players.filter(E.isAlive).reduce((s, p) => s + (p.rewardTokens || 0), 0);
  host.innerHTML = `<div class="card">
    <h2>⚖️ Balance of power</h2>
    <div class="bal"><span class="m"><span class="big">${activeMafia}</span> Mafia</span>
      <span class="g">crew <span class="big">${activeGood}</span></span></div>
    <div class="bar"><span class="m" style="width:${(activeMafia / total) * 100}%"></span>
      <span class="g" style="width:${(activeGood / total) * 100}%"></span></div>
    <ul class="facts">
      <li>Crew lead (Mafia win at 0)<b>${activeMafia === 0 ? 'No Mafia left' : gap <= 0 ? 'Mafia have parity' : gap}</b></li>
      <li>Mafia Legacy<b>${legacy}</b></li>
      ${g.countdownEnabled ? `<li>Countdown<b>${g.roundsRemaining ?? '—'} week(s) left</b></li>` : ''}
      <li>Tokens held by living players<b>${tokens}</b></li>
      <li>Here this week<b>${present().length} of ${players.filter(E.isAlive).length} alive</b></li>
    </ul>
  </div>`;
}

/* --------------------------------------------------------- timeline --- */
function auditKind(a) {
  if (a.eventType === 'RESOLUTION_PUBLISHED') return /killed/i.test(a.summary || '') ? 'kill' : 'night';
  return AUDIT_KIND[a.eventType] ?? 'admin';
}

function paintTimeline() {
  const r = round();
  const fromLog = audit.map((a) => ({
    key: 'a' + (a.id ?? a.timestamp + a.eventType),
    kind: auditKind(a), round: a.round, at: a.timestamp,
    html: (a.actorId && byId(a.actorId) ? crew(a.actorId, 'mini') : '') + esc(a.summary || prettyType(a.eventType))
  }));
  let all = [...liveEvents.map((e) => ({ ...e, key: e.id })), ...fromLog];
  if (tlScope === 'week') all = all.filter((e) => e.round === r);
  all.sort((a, b) => (Date.parse(b.at) || 0) - (Date.parse(a.at) || 0));
  all = all.slice(0, 120);

  $('timeline').innerHTML = all.length ? all.map((e) => {
    const [icon, colour] = KIND[e.kind] ?? KIND.admin;
    const fresh = !firstTl && !seenTl.has(e.key);
    return `<div class="ev${fresh ? ' fresh' : ''}"><span class="ic" style="--k:${colour}" aria-hidden="true">${icon}</span>
      <div class="tx">${e.html}<span class="wh">${e.round ? `Week ${e.round} · ` : ''}${fmtTime(e.at)}</span></div></div>`;
  }).join('') : `<p class="empty">${tlScope === 'week' ? 'Nothing has happened this week yet.' : 'Nothing has happened yet.'}</p>`;
  for (const e of all) seenTl.add(e.key);
  firstTl = false;
}

document.querySelectorAll('[data-scope]').forEach((btn) => {
  btn.onclick = () => {
    tlScope = btn.dataset.scope;
    document.querySelectorAll('[data-scope]').forEach((b) => b.classList.toggle('on', b === btn));
    firstTl = true;
    paintTimeline();
  };
});

setInterval(() => {
  if (phase() !== 'VOTING') return;
  const left = voteLeft();
  if (left === null) return;
  document.querySelectorAll('.jsClock').forEach((c) => {
    c.textContent = fmtClock(left);
    c.classList.toggle('done', left === 0);
    c.classList.toggle('paused', left > 0 && !clockRunning());
  });
}, 500);

/* ------------------------------------------------------------- veil --- */
function applyVeil() {
  if (!loaded) return;
  $('app').classList.toggle('hide', veil);
  $('veilCard').classList.toggle('hide', !veil);
  $('veilBtn').textContent = veil ? 'Show secrets' : 'Hide secrets';
  sessionStorage.setItem('ampid-observer-veil', veil ? '1' : '0');
}
const toggleVeil = () => { veil = !veil; applyVeil(); };
$('veilBtn').onclick = toggleVeil;
$('unveil').onclick = toggleVeil;
document.addEventListener('keydown', (e) => {
  if (!loaded || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return;
  if (e.key === 'h' || e.key === 'H') toggleVeil();
});

/* ------------------------------------------------------------ utils --- */
function fail(msg) { $('err').innerHTML = `<div class="err">${esc(msg)}</div>`; }

/* ------------------------------------------------------------- boot --- */
$('go').onclick = async () => {
  $('err').innerHTML = '';
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim().toLowerCase(),
    password: $('pw').value
  });
  if (error) {
    if (/not confirmed/i.test(error.message)) return fail('That account exists but its email is not confirmed. Run observer.sql with this email - it confirms it for you.');
    if (/invalid login/i.test(error.message)) return fail('Wrong email or password. Check the account exists under Authentication → Users in Supabase, and reset the password there if unsure.');
    return fail(error.message);
  }
  load();
};
$('pw').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };
$('out').onclick = async () => {
  clearTimeout(timer);
  sessionStorage.removeItem('ampid-observer-veil');
  await sb.auth.signOut();
  location.reload();
};

const { data: { session } } = await sb.auth.getSession();
if (session) load();
</script>
</body>
</html>
